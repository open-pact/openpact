# OpenPact configuration
#
# Most settings now live behind the admin UI at /settings/advanced and
# /integrations, and LLM provider credentials + default model are managed
# at /engine (they are persisted inside the stackllm data directory, not
# here). This file covers only the bootstrap essentials.

# engine.db_path is an optional override for the stackllm SQLite session
# database. Default: <workspace>/secure/data/stackllm.db.
engine:
  db_path: ""

workspace:
  path: /workspace

discord:
  enabled: true
  allowed_users: []  # User IDs allowed to DM (empty = all)
  allowed_chans: []  # Channel IDs allowed (empty = all)

starlark:
  max_execution_ms: 30000  # 30 seconds
  max_memory_mb: 128

admin:
  enabled: true
  bind: "localhost:8888"
